<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
const STATS_ENDPOINT_URL = 'https://stats-endpoint-standard-ujzabdesxa-uc.a.run.app';

const SIDEBAR_STATE_KEY = 'statsSidebarCollapsed';
let dateRangePicker = null;

function isDesktopLayout() {
  return window.matchMedia('(min-width: 1024px)').matches;
}

function setSidebarButtonLabel() {
  const button = document.getElementById('statsSidebarToggle');
  if (!button) return;
  button.textContent = document.body.classList.contains('stats-sidebar-collapsed') ? 'Show Sidebar' : 'Hide Sidebar';
}

function applySidebarState(collapsed) {
  if (collapsed) document.body.classList.add('stats-sidebar-collapsed');
  else document.body.classList.remove('stats-sidebar-collapsed');
  setSidebarButtonLabel();
}

function initializeSidebarToggle() {
  const button = document.getElementById('statsSidebarToggle');
  if (!button) return;

  const savedCollapsed = localStorage.getItem(SIDEBAR_STATE_KEY) === '1';
  applySidebarState(isDesktopLayout() && savedCollapsed);

  button.addEventListener('click', () => {
    const collapsed = !document.body.classList.contains('stats-sidebar-collapsed');
    applySidebarState(collapsed);
    localStorage.setItem(SIDEBAR_STATE_KEY, collapsed ? '1' : '0');
  });

  window.addEventListener('resize', () => {
    const collapsed = localStorage.getItem(SIDEBAR_STATE_KEY) === '1';
    applySidebarState(isDesktopLayout() && collapsed);
  });
}

function getParams() {
  const p = new URLSearchParams(window.location.search);
  const series = p.get('series') || 'IndyCar';
  const selectedSeries = ['IndyCar', 'IndyNXT', 'All'].includes(series) ? series : 'IndyCar';
  const trackType = p.get('trackType') || 'All';
  const selectedTrackType = ['All', 'O', 'R', 'S', 'Indy500'].includes(trackType) ? trackType : 'All';
  return {
    series: selectedSeries,
    agg_level: p.get('agg_level') || 'Driver',
    season: p.get('season') || '2026',
    team: p.get('team') || 'All',
    trackType: selectedTrackType,
    minRaces: p.get('minRaces') || '1',
    startDate: p.get('startDate') || '',
    endDate: p.get('endDate') || ''
  };
}

function setParams(series, agg_level, season, team, trackType, minRaces, startDate, endDate) {
  const u = new URL(window.location);
  u.searchParams.set('series', series);
  u.searchParams.set('agg_level', agg_level);
  u.searchParams.set('season', season);
  u.searchParams.set('team', team);
  u.searchParams.set('trackType', trackType);
  u.searchParams.set('minRaces', minRaces);
  if (startDate && endDate) {
    u.searchParams.set('startDate', startDate);
    u.searchParams.set('endDate', endDate);
  } else {
    u.searchParams.delete('startDate');
    u.searchParams.delete('endDate');
  }
  u.searchParams.delete('indy500');
  window.history.replaceState({}, '', u);
}

async function loadStats(series, agg_level, season, team, trackType, minRaces, startDate, endDate) {
  setStatsLoadingVisible(true);
  clearStatsError();
  hideStatsTable();

  try {
    const url = new URL(STATS_ENDPOINT_URL);
    url.searchParams.set('series', series);
    url.searchParams.set('agg_level', agg_level);
    url.searchParams.set('season', season);
    url.searchParams.set('team', team);
    url.searchParams.set('trackType', trackType);
    url.searchParams.set('minRaces', minRaces);
    if (startDate && endDate) {
      url.searchParams.set('startDate', startDate);
      url.searchParams.set('endDate', endDate);
    }
    console.log('Fetching stats:', url.toString());
    const r = await fetch(url.toString(), { cache: 'no-store' });
    const payload = await r.json();
    if (!payload.success || !Array.isArray(payload.data)) throw new Error(payload.error || 'Failed to load stats');
    setStatsTableData(payload.data, { linkDriverColumn: agg_level === 'Driver' });
  } catch (e) {
    showStatsError(`Error loading stats: ${e.message}`);
  } finally {
    setStatsLoadingVisible(false);
  }
}

function syncDateRangeState() {
  const hasDateRange = !!(dateRangePicker && dateRangePicker.selectedDates.length === 2);
  const seasonInput = document.getElementById('season');
  seasonInput.disabled = hasDateRange;
  seasonInput.title = hasDateRange ? 'Clear the date filter to select a single season' : '';
}

function initializeDateRangePicker(startDate, endDate) {
  const defaultDate = startDate && endDate ? [startDate, endDate] : null;
  dateRangePicker = flatpickr('#dateRange', {
    mode: 'range',
    dateFormat: 'Y-m-d',
    defaultDate,
    onChange: syncDateRangeState
  });
}

document.getElementById('statsForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const series = document.getElementById('series').value;
  const agg_level = document.getElementById('agg_level').value;
  const season = document.getElementById('season').value;
  const teamInput = document.getElementById('team');
  const team = teamInput ? teamInput.value : 'All';
  const trackType = document.getElementById('trackType').value;
  const minRaces = document.getElementById('minRaces').value;
  const selectedDates = dateRangePicker ? dateRangePicker.selectedDates : [];
  const hasDateRange = selectedDates.length === 2;

  if (selectedDates.length === 1) {
    showStatsError('Select a complete date range.');
    return;
  }

  const startDate = hasDateRange ? dateRangePicker.formatDate(selectedDates[0], 'Y-m-d') : '';
  const endDate = hasDateRange ? dateRangePicker.formatDate(selectedDates[1], 'Y-m-d') : '';

  const seasonForQuery = hasDateRange ? 'All' : season;
  setParams(series, agg_level, seasonForQuery, team, trackType, minRaces, startDate, endDate);
  loadStats(series, agg_level, seasonForQuery, team, trackType, minRaces, startDate, endDate);
});

document.addEventListener('DOMContentLoaded', () => {
  initializeSidebarToggle();
  const { series, agg_level, season, team, trackType, minRaces, startDate, endDate } = getParams();
  const seasonForLoad = startDate && endDate ? 'All' : season;
  document.getElementById('series').value = series;
  document.getElementById('agg_level').value = agg_level;
  document.getElementById('season').value = seasonForLoad;
  const teamInput = document.getElementById('team');
  if (teamInput) teamInput.value = team;
  document.getElementById('trackType').value = trackType;
  document.getElementById('minRaces').value = minRaces;
  initializeDateRangePicker(startDate, endDate);
  syncDateRangeState();
  loadStats(series, agg_level, seasonForLoad, team, trackType, minRaces, startDate, endDate);
});
</script>
