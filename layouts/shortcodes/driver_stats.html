<div class="driver-stats-view">
  <div class="driver-header stats-panel">
    <h2 id="driverTitle">Driver Stats</h2>
  </div>

  <div class="driver-tabs">
    <button id="driverTabStats" class="driver-tab-btn active" type="button">Stats</button>
    <button id="driverTabRaceLogs" class="driver-tab-btn" type="button">Race Logs</button>
  </div>

  <div id="driverStatsPanel" class="driver-tab-panel active">
    <div class="driver-stats-controls stats-panel">
      <form id="driverStatsForm" class="driver-stats-form">
        <label>
          Track Type
          <select id="driverTrackType" name="trackType">
            <option value="All" selected>All</option>
            <option value="O">Oval</option>
            <option value="R">Road</option>
            <option value="S">Street</option>
            <option value="RS">Road + Street</option>
            <option value="Indy500">Indy 500 Only</option>
          </select>
        </label>

        <label class="driver-stats-date-range">
          Date Range
          <span class="driver-stats-date-range-inputs">
            <input id="driverDateRange" name="dateRange" type="text" placeholder="Select date range" autocomplete="off" />
          </span>
        </label>

        <button type="submit">Load</button>
      </form>
    </div>

    {{ partial "stats_table.html" . }}
  </div>

  <div id="driverRaceLogsPanel" class="driver-tab-panel">
    <div class="driver-racelog-controls stats-panel">
      <label for="raceLogSeason">Season</label>
      <select id="raceLogSeason"></select>
    </div>

    <div id="raceLogLoading" class="stats-loading">Loading...</div>
    <div id="raceLogError" class="stats-error"></div>

    <div id="raceLogTableWrap" class="stats-table-wrap stats-panel">
      <table id="raceLogTable">
        <thead>
          <tr>
            <th>Series</th>
            <th>Date</th>
            <th>Track Type</th>
            <th>Laps</th>
            <th>SP</th>
            <th>FP</th>
            <th>PG</th>
            <th>faPG</th>
            <th>LL</th>
            <th>Status</th>
            <th>Pts</th>
          </tr>
        </thead>
        <tbody id="raceLogBody"></tbody>
      </table>
    </div>
  </div>
</div>

<style>
.driver-stats-view { margin-top: 1rem; }
.driver-header {
  margin-bottom: .9rem;
  padding: 1rem;
  border: 1px solid var(--card-separator-color);
  border-radius: var(--card-border-radius);
  background: var(--card-background);
  box-shadow: var(--shadow-l1);
}
.driver-header h2 { margin: 0 0 .3rem 0; }
.driver-tabs {
  display: flex;
  gap: .5rem;
  margin-bottom: .8rem;
}
.driver-tab-btn {
  border: 1px solid var(--card-separator-color);
  background: var(--body-background);
  color: var(--card-text-color);
  border-radius: .5rem;
  padding: .45rem .8rem;
  cursor: pointer;
}
.driver-tab-btn.active {
  background: var(--card-background);
  font-weight: 600;
}
.driver-tab-panel { display: none; }
.driver-tab-panel.active { display: block; }
.driver-stats-controls {
  margin-bottom: .75rem;
  padding: .85rem;
}
.driver-stats-form {
  display: flex;
  gap: .8rem;
  flex-wrap: wrap;
  align-items: end;
}
.driver-stats-form label {
  display: flex;
  flex-direction: column;
  gap: .42rem;
  font-size: .9rem;
  color: var(--card-text-color-secondary);
}
.driver-stats-form select,
.driver-stats-form input,
.driver-stats-form button {
  padding: .52rem .76rem;
  border-radius: .5rem;
  border: 1px solid var(--card-separator-color);
  background: var(--body-background);
  color: var(--card-text-color-main);
}
.driver-stats-date-range-inputs {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
}
#driverDateRange { min-width: 220px; }
.driver-stats-form button {
  background: var(--accent-color);
  color: white;
  border-color: var(--accent-color);
  font-weight: 600;
  cursor: pointer;
}
.driver-stats-form button:hover { filter: brightness(0.95); }
.driver-racelog-controls {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  padding: .7rem .85rem;
  margin-bottom: .6rem;
}
.driver-racelog-controls label {
  font-size: .88rem;
  color: var(--card-text-color-secondary);
}
.driver-racelog-controls select {
  border: 1px solid var(--card-separator-color);
  border-radius: .4rem;
  background: var(--card-background);
  color: var(--card-text-color);
  padding: .3rem .45rem;
}
#raceLogTable { width: 100%; border-collapse: collapse; font-size: 60%; line-height: 1.35; }
#raceLogTable th, #raceLogTable td {
  padding: .62rem .78rem;
  border-bottom: 1px solid var(--card-separator-color);
  text-align: left;
  white-space: nowrap;
}
#raceLogTable th {
  background: var(--body-background);
  font-weight: 600;
  position: sticky;
  top: 0;
  z-index: 1;
}
#raceLogTable tbody td { background: var(--card-background); }
#raceLogTable tbody tr:nth-child(even) td { background: var(--body-background); }
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
const STATS_ENDPOINT_URL = 'https://stats-endpoint-standard-ujzabdesxa-uc.a.run.app';
const DRIVER_RACE_LOGS_ENDPOINT_URL = 'https://driver-race-logs-endpoint-ujzabdesxa-uc.a.run.app';

let raceLogInitialLoadDone = false;
let driverDateRangePicker = null;

function getDriverFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const driver = params.get('driver');
  return driver ? driver.trim() : '';
}

function getDriverPageStateFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const trackType = params.get('trackType') || 'All';
  const selectedTrackType = ['All', 'O', 'RS', 'R', 'S', 'Indy500'].includes(trackType) ? trackType : 'All';
  return {
    tab: params.get('tab') === 'race-logs' ? 'logs' : 'stats',
    season: params.get('season') || '',
    trackType: selectedTrackType,
    startDate: params.get('startDate') || '',
    endDate: params.get('endDate') || ''
  };
}

function setDriverPageParams(tab, season) {
  const url = new URL(window.location);
  if (tab === 'logs') url.searchParams.set('tab', 'race-logs');
  else url.searchParams.delete('tab');
  if (season) url.searchParams.set('season', season);
  else url.searchParams.delete('season');
  window.history.replaceState({}, '', url);
}

function setDriverStatsParams(trackType, startDate, endDate) {
  const url = new URL(window.location);
  url.searchParams.set('trackType', trackType || 'All');
  if (startDate && endDate) {
    url.searchParams.set('startDate', startDate);
    url.searchParams.set('endDate', endDate);
  } else {
    url.searchParams.delete('startDate');
    url.searchParams.delete('endDate');
  }
  window.history.replaceState({}, '', url);
}

function setDriverTitle(driver) {
  const title = document.getElementById('driverTitle');
  if (!title) return;
  title.textContent = driver ? `${driver} Stats` : 'Driver Stats';
  document.title = driver ? `${driver} Stats` : 'Driver Pages';
}

function initializeDriverDateRangePicker(startDate, endDate) {
  const defaultDate = startDate && endDate ? [startDate, endDate] : null;
  driverDateRangePicker = flatpickr('#driverDateRange', {
    mode: 'range',
    dateFormat: 'Y-m-d',
    defaultDate
  });
}

function setRaceLogLoadingVisible(visible) {
  const loading = document.getElementById('raceLogLoading');
  if (loading) loading.style.display = visible ? 'block' : 'none';
}

function showRaceLogError(message) {
  const error = document.getElementById('raceLogError');
  if (!error) return;
  error.textContent = message;
  error.style.display = 'block';
}

function clearRaceLogError() {
  const error = document.getElementById('raceLogError');
  if (error) error.style.display = 'none';
}

function setActiveDriverTab(tab) {
  const statsBtn = document.getElementById('driverTabStats');
  const logsBtn = document.getElementById('driverTabRaceLogs');
  const statsPanel = document.getElementById('driverStatsPanel');
  const logsPanel = document.getElementById('driverRaceLogsPanel');
  if (!statsBtn || !logsBtn || !statsPanel || !logsPanel) return;

  const showStats = tab === 'stats';
  statsBtn.classList.toggle('active', showStats);
  logsBtn.classList.toggle('active', !showStats);
  statsPanel.classList.toggle('active', showStats);
  logsPanel.classList.toggle('active', !showStats);

  const seasonSelect = document.getElementById('raceLogSeason');
  setDriverPageParams(tab, !showStats && seasonSelect ? seasonSelect.value : '');
}

function getDefaultRaceLogSeason(seasons) {
  return seasons.length > 0 ? seasons[0] : String(new Date().getFullYear());
}

function populateRaceLogSeasonOptions(data, preferredSeason = '') {
  const select = document.getElementById('raceLogSeason');
  if (!select) return;
  select.innerHTML = '';

  const seasons = [...new Set((Array.isArray(data) ? data : []).map((row) => String(row.Season)).filter(Boolean))]
    .sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));

  seasons.forEach((season) => {
    const option = document.createElement('option');
    option.value = season;
    option.textContent = season;
    select.appendChild(option);
  });

  const defaultSeason = seasons.includes(preferredSeason) ? preferredSeason : getDefaultRaceLogSeason(seasons);
  if (select.options.length === 0) {
    const option = document.createElement('option');
    option.value = defaultSeason;
    option.textContent = defaultSeason;
    select.appendChild(option);
  }

  select.value = defaultSeason;
}

function renderRaceLogTable(rows) {
  const body = document.getElementById('raceLogBody');
  const wrap = document.getElementById('raceLogTableWrap');
  if (!body || !wrap) return;

  body.innerHTML = '';
  if (!Array.isArray(rows) || rows.length === 0) {
    body.innerHTML = '<tr><td colspan="11">No race logs available</td></tr>';
    wrap.style.display = 'block';
    return;
  }

  rows.forEach((row) => {
    const tr = document.createElement('tr');
    ['Series', 'Date', 'Track Type', 'Laps', 'SP', 'FP', 'PG', 'faPG', 'LL', 'Status', 'Pts'].forEach((col) => {
      const td = document.createElement('td');
      td.textContent = row[col] ?? '-';
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  wrap.style.display = 'block';
}

async function loadDriverStats(driver, preferredSeason = '', trackType = 'All', startDate = '', endDate = '', updateSeasonOptions = false) {
  if (!driver) {
    showStatsError('No driver selected. Open this page from a driver link in the stats table.');
    return;
  }

  setStatsLoadingVisible(true);
  clearStatsError();
  hideStatsTable();

  try {
    const url = new URL(STATS_ENDPOINT_URL);
    url.searchParams.set('agg_level', 'SeasonSeries');
    url.searchParams.set('series', 'All');
    url.searchParams.set('season', 'All');
    url.searchParams.set('trackType', trackType);
    url.searchParams.set('minRaces', '0');
    url.searchParams.set('driver', driver);
    if (startDate && endDate) {
      url.searchParams.set('startDate', startDate);
      url.searchParams.set('endDate', endDate);
    }

    const response = await fetch(url.toString(), { cache: 'no-store' });
    const payload = await response.json();
    if (!payload.success || !Array.isArray(payload.data)) throw new Error(payload.error || 'Failed to load driver stats');
    setStatsTableData(payload.data, { linkDriverColumn: false });
    if (updateSeasonOptions) populateRaceLogSeasonOptions(payload.data, preferredSeason);
  } catch (e) {
    showStatsError(`Error loading stats: ${e.message}`);
  } finally {
    setStatsLoadingVisible(false);
  }
}

async function loadRaceLogs(driver) {
  const seasonSelect = document.getElementById('raceLogSeason');
  const season = seasonSelect ? seasonSelect.value : String(new Date().getFullYear());

  if (!driver) {
    showRaceLogError('No driver selected. Open this page from a driver link in the stats table.');
    return;
  }

  setRaceLogLoadingVisible(true);
  clearRaceLogError();

  try {
    const url = new URL(DRIVER_RACE_LOGS_ENDPOINT_URL);
    url.searchParams.set('season', season);
    url.searchParams.set('driver', driver);

    const response = await fetch(url.toString(), { cache: 'no-store' });
    const payload = await response.json();
    if (!payload.success || !Array.isArray(payload.data)) throw new Error(payload.error || 'Failed to load race logs');
    renderRaceLogTable(payload.data);
    setDriverPageParams('logs', season);
  } catch (e) {
    showRaceLogError(`Error loading race logs: ${e.message}`);
  } finally {
    setRaceLogLoadingVisible(false);
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  const pageState = getDriverPageStateFromUrl();
  const driver = getDriverFromUrl();
  const trackTypeSelect = document.getElementById('driverTrackType');
  const driverStatsForm = document.getElementById('driverStatsForm');
  setDriverTitle(driver);
  if (trackTypeSelect) trackTypeSelect.value = pageState.trackType;
  initializeDriverDateRangePicker(pageState.startDate, pageState.endDate);
  await loadDriverStats(driver, pageState.season, pageState.trackType, pageState.startDate, pageState.endDate, true);

  const statsTab = document.getElementById('driverTabStats');
  const raceLogsTab = document.getElementById('driverTabRaceLogs');
  const raceLogSeason = document.getElementById('raceLogSeason');

  if (driverStatsForm) {
    driverStatsForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const trackType = trackTypeSelect ? trackTypeSelect.value : 'All';
      const selectedDates = driverDateRangePicker ? driverDateRangePicker.selectedDates : [];
      if (selectedDates.length === 1) {
        showStatsError('Select a complete date range.');
        return;
      }
      const hasDateRange = selectedDates.length === 2;
      const startDate = hasDateRange ? driverDateRangePicker.formatDate(selectedDates[0], 'Y-m-d') : '';
      const endDate = hasDateRange ? driverDateRangePicker.formatDate(selectedDates[1], 'Y-m-d') : '';
      setDriverStatsParams(trackType, startDate, endDate);
      loadDriverStats(driver, raceLogSeason ? raceLogSeason.value : '', trackType, startDate, endDate, false);
    });
  }

  if (statsTab) {
    statsTab.addEventListener('click', () => setActiveDriverTab('stats'));
  }

  if (raceLogsTab) {
    raceLogsTab.addEventListener('click', () => {
      setActiveDriverTab('logs');
      if (!raceLogInitialLoadDone) {
        loadRaceLogs(driver);
        raceLogInitialLoadDone = true;
      }
    });
  }

  if (raceLogSeason) {
    raceLogSeason.addEventListener('change', () => {
      if (document.getElementById('driverRaceLogsPanel')?.classList.contains('active')) loadRaceLogs(driver);
      else setDriverPageParams('stats', raceLogSeason.value);
    });
  }

  if (pageState.tab === 'logs') {
    setActiveDriverTab('logs');
    loadRaceLogs(driver);
    raceLogInitialLoadDone = true;
  } else {
    setActiveDriverTab('stats');
  }
});
</script>
