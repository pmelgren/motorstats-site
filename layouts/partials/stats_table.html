<div id="statsLoading" class="stats-loading">Loading...</div>
<div id="statsError" class="stats-error"></div>

<div id="statsTableWrap" class="stats-table-wrap stats-panel">
  <table id="statsTable">
    <thead>
      <tr id="statsHeader"></tr>
    </thead>
    <tbody id="statsBody"></tbody>
  </table>
</div>

<style>
.stats-loading, .stats-error { display: none; margin-top: .9rem; padding: .7rem .85rem; border-radius: .55rem; }
.stats-loading { background: var(--body-background); color: var(--card-text-color-secondary); border: 1px dashed var(--card-separator-color); }
.stats-error { background: rgba(176, 0, 32, .08); color: #b00020; border: 1px solid rgba(176, 0, 32, .28); }

.stats-table-wrap { display: none; overflow-x: auto; margin-top: 1rem; }
#statsTable { width: 100%; border-collapse: collapse; font-size: 60%; line-height: 1.35; }
#statsTable th, #statsTable td {
  padding: .62rem .78rem;
  border-bottom: 1px solid var(--card-separator-color);
  text-align: left;
  white-space: nowrap;
}
#statsTable th {
  cursor: pointer;
  background: var(--body-background);
  font-weight: 600;
  position: sticky;
  top: 0;
  z-index: 1;
}
#statsTable th.sort-asc::after,
#statsTable th.sort-desc::after {
  margin-left: .35rem;
  color: var(--card-text-color-secondary);
}
#statsTable th.sort-asc::after { content: "▲"; }
#statsTable th.sort-desc::after { content: "▼"; }

#statsTable th:first-child,
#statsTable td:first-child {
  position: sticky;
  left: 0;
  z-index: 2;
  box-shadow: 1px 0 0 var(--card-separator-color);
}
#statsTable th:first-child { z-index: 3; }

#statsTable tbody td { background: var(--card-background); }
#statsTable tbody tr:nth-child(even) td { background: var(--body-background); }
</style>

<script>
const COLUMN_TOOLTIPS = {
  R: 'R: Total Races',
  Laps: 'Laps: Total Laps Completed ',
  LL: 'LL: Total Laps Led',
  SP: 'SP: Average Starting Position',
  QP: 'QP: Average Qualifying Position',
  FP: 'FP: Average Finishing Position',
  Poles: 'Count of Times Ranked First in Qualifying',
  ARP: 'ARP: Average Running Position',
  PG: 'PG: Average Positions Gained',
  DNF: 'DNF: Did Not Finish Count',
  pDNF: 'pDNF: Average position at the time of DNF',
  W: 'W: Race Wins',
  POD: 'POD: Podiums (Top 3 Finishes)',
  T10: 'T10: Top-10 Finishes',
  Pts: 'Pts: Championship Points',
  eqLaps: 'eqLaps: Track-equalized Laps Completed',
  eqLL: 'eqLL: Track-equalized Laps Led',
  eqARP: 'eqARP: Track-equalized Average Running Position',
  faPG: 'faPG: Finisher-adjusted Positions Gained',
  DNFm: 'DNFm: Mechanical DNFs',
  DNFc: 'DNFc: Contact DNFs',
  F6: 'F6: Top 6 Qualifying Performances (Includes Ovals)',
  F12: 'F12: Top 12 Qualifying Performances (Includes Ovals)',
  vsTeam: 'vsTeam: Win % vs Teammates in Qualifying',
  nGap: 'nGap: Average Gap Based on a Normalized 60s Lap Time',
  'Qual-': 'Qual-: Qualifying Performance, 100 is Median'
};

let statsData = [];
let sortColumn = null;
let sortDirection = 'desc';
let statsTableOptions = {};

function getColumnTooltip(column) {
  return COLUMN_TOOLTIPS[column] || '';
}

function setStatsLoadingVisible(visible) {
  const loading = document.getElementById('statsLoading');
  if (loading) loading.style.display = visible ? 'block' : 'none';
}

function showStatsError(message) {
  const error = document.getElementById('statsError');
  if (!error) return;
  error.textContent = message;
  error.style.display = 'block';
}

function clearStatsError() {
  const error = document.getElementById('statsError');
  if (error) error.style.display = 'none';
}

function hideStatsTable() {
  const wrap = document.getElementById('statsTableWrap');
  if (wrap) wrap.style.display = 'none';
}

const ENTRY_LINK_PARAMS = { Driver: 'driver', Team: 'team', Engine: 'engine', Eng: 'engine' };
const PERCENT_COLUMNS = new Set(['vsTeam']);

function buildEntryUrl(column, name) {
  const query = new URLSearchParams();
  query.set(ENTRY_LINK_PARAMS[column], String(name));
  if (statsTableOptions.sourceSeries) query.set('series', statsTableOptions.sourceSeries);
  return '/entries/?' + query.toString();
}

function renderCellValue(column, value) {
  if (statsTableOptions.linkDriverColumn && ENTRY_LINK_PARAMS[column] && value && value !== '-') {
    const link = document.createElement('a');
    link.href = buildEntryUrl(column, String(value));
    link.textContent = value;
    return link;
  }
  if (PERCENT_COLUMNS.has(column) && typeof value === 'number') {
    return document.createTextNode(value + '%');
  }
  return document.createTextNode(value ?? '-');
}

function renderTable() {
  const header = document.getElementById('statsHeader');
  const body = document.getElementById('statsBody');
  if (!header || !body) return;

  header.innerHTML = '';
  body.innerHTML = '';

  if (statsData.length === 0) {
    body.innerHTML = '<tr><td>No data available</td></tr>';
    return;
  }

  const columns = Array.isArray(statsTableOptions.visibleColumns)
    ? statsTableOptions.visibleColumns.filter((col) => col in statsData[0])
    : Object.keys(statsData[0]);
  columns.forEach((col) => {
    const th = document.createElement('th');
    th.textContent = col;
    th.title = getColumnTooltip(col);
    th.onclick = () => sortBy(col);
    if (sortColumn === col) th.classList.add(sortDirection === 'asc' ? 'sort-asc' : 'sort-desc');
    header.appendChild(th);
  });

  statsData.forEach((row) => {
    const tr = document.createElement('tr');
    columns.forEach((col) => {
      const td = document.createElement('td');
      td.appendChild(renderCellValue(col, row[col]));
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

function isEmptySortValue(value) {
  return value === null || value === undefined || value === '' || value === '-';
}

function applySort(column, direction) {
  sortColumn = column;
  sortDirection = direction;

  statsData.sort((a, b) => {
    const av = a[column];
    const bv = b[column];
    const aEmpty = isEmptySortValue(av);
    const bEmpty = isEmptySortValue(bv);
    if (aEmpty && bEmpty) return 0;
    if (aEmpty) return 1;
    if (bEmpty) return -1;
    const an = Number(av);
    const bn = Number(bv);
    if (!Number.isNaN(an) && !Number.isNaN(bn)) return sortDirection === 'asc' ? an - bn : bn - an;
    return sortDirection === 'asc' ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
  });

  renderTable();
}

function sortBy(column) {
  const direction = sortColumn === column ? (sortDirection === 'asc' ? 'desc' : 'asc') : 'desc';
  applySort(column, direction);
}

function resetStatsSort() {
  sortColumn = null;
  sortDirection = 'desc';
  renderTable();
}

function showStatsTable() {
  const wrap = document.getElementById('statsTableWrap');
  if (wrap) wrap.style.display = 'block';
}

function setStatsTableData(data, options = {}) {
  statsData = Array.isArray(data) ? data : [];
  statsTableOptions = options;
  if (options.defaultSort && statsData.length > 0 && options.defaultSort.column in statsData[0]) {
    applySort(options.defaultSort.column, options.defaultSort.direction || 'desc');
  } else {
    resetStatsSort();
  }
  showStatsTable();
}

function setStatsTableView(viewOptions = {}) {
  statsTableOptions = Object.assign({}, statsTableOptions, viewOptions);
  if (statsData.length === 0) return;
  const defaultSort = statsTableOptions.defaultSort;
  if (defaultSort && defaultSort.column in statsData[0]) {
    applySort(defaultSort.column, defaultSort.direction || 'desc');
  } else {
    resetStatsSort();
  }
}
</script>
